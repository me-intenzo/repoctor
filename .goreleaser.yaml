version: 2

project_name: repoctor

builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - '-s -w -X github.com/me-intenzo/repoctor/internal/version.Version={{ .Version }}'
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'